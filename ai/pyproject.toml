[project]
name = "work-management-ai"
version = "0.1.0"
description = "Provider-neutral AI engineering package for work management"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain>=1.3,<1.4",
    "langchain-openai>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "langsmith>=0.10,<0.11",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
